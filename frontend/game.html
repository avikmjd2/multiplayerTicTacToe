<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena :: Match Protocol</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.2;
            z-index: -1;
        }

        .game-card {
            background: rgba(13, 25, 41, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 229, 255, 0.1);
            text-align: center;
            position: relative;
        }

        /* Cyberpunk Decals */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #00e5ff;
        }

        .top-left {
            top: -5px;
            left: -5px;
            border-right: none;
            border-bottom: none;
        }

        .bottom-right {
            bottom: -5px;
            right: -5px;
            border-left: none;
            border-top: none;
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: 20px;
        }

        h2 {
            font-size: 22px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        .symbol-badge {
            background: rgba(0, 229, 255, 0.1);
            padding: 8px 16px;
            border-radius: 5px;
            border: 1px solid rgba(0, 229, 255, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Status Indicator */
        .game-status {
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 30px;
            height: 30px;
            transition: color 0.3s ease;
        }

        .status-waiting {
            color: #8492a6;
        }

        .status-my-turn {
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
        }

        .status-opponent-turn {
            color: #ff9900;
        }

        .status-win {
            color: #00e5ff;
            text-shadow: 0 0 25px #00e5ff;
            font-size: 26px;
            animation: pulse 1.5s infinite;
        }

        .status-lose {
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
        }

        .status-draw {
            color: #cccccc;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* The Board */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            gap: 15px;
            justify-content: center;
            margin: 0 auto;
        }

        .cell {
            width: 110px;
            height: 110px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .cell:hover {
            border-color: rgba(0, 229, 255, 0.8);
            background: rgba(0, 229, 255, 0.05);
            box-shadow: inset 0 0 25px rgba(0, 229, 255, 0.2), 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .cell.occupied {
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.6);
        }

        .cell.occupied:hover {
            border-color: rgba(0, 229, 255, 0.2);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .x-mark {
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
        }

        .o-mark {
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
        }

        /* Post-game actions */
        .actions {
            margin-top: 30px;
            display: none;
        }

        .btn-return {
            background: transparent;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-return:hover {
            background: #00e5ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="bg-overlay"></div>

    <div class="game-card">
        <div class="corner top-left"></div>
        <div class="corner bottom-right"></div>

        <header>
            <h2>Arena Match</h2>
            <div class="symbol-badge" id="player-symbol">SYNCING...</div>
        </header>

        <div class="game-status status-waiting" id="game-status">
            CONNECTING TO SERVER...
        </div>

        <div class="board" id="board">
            <!-- Row 0 -->
            <div class="cell" data-row="0" data-col="0"></div>
            <div class="cell" data-row="0" data-col="1"></div>
            <div class="cell" data-row="0" data-col="2"></div>
            <!-- Row 1 -->
            <div class="cell" data-row="1" data-col="0"></div>
            <div class="cell" data-row="1" data-col="1"></div>
            <div class="cell" data-row="1" data-col="2"></div>
            <!-- Row 2 -->
            <div class="cell" data-row="2" data-col="0"></div>
            <div class="cell" data-row="2" data-col="1"></div>
            <div class="cell" data-row="2" data-col="2"></div>
        </div>

        <div class="actions" id="actions-panel">
            <button class="btn-return" onclick="window.location.href='/lobby'">Return to Lobby</button>
        </div>
    </div>

    <script src="/static/js/game.js"></script>
</body>

</html>
