<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena :: Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Pearl & Obsidian Design System (matches lobby) ── */
        :root {
            --bg: #ebeef2;
            --surface: #ebeef2;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --text-3: var(--text-muted);
            --shadow-dark: rgba(180, 190, 205, 0.7);
            --shadow-light: rgba(255, 255, 255, 1);
            --accent: #3b82f6;
            --accent-dim: rgba(59, 130, 246, 0.15);
            --success: #10b981;
            --danger: #ef4444;
            --ambient-1: rgba(59, 130, 246, 0.06);
            --ambient-2: rgba(0, 0, 0, 0.02);
            --search-inset-dark: rgba(180, 190, 205, 0.5);
            --search-inset-light: rgba(255, 255, 255, 0.9);
            --ff-body: 'DM Sans', sans-serif;
            --ff-mono: 'JetBrains Mono', monospace;
            --r-md: 18px;
            --r-lg: 18px;
            --r-xl: 30px;
        }

        [data-theme="dark"] {
            --bg: #13141a;
            --surface: #13141a;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #475569;
            --text-3: var(--text-muted);
            --shadow-dark: rgba(0, 0, 0, 0.85);
            --shadow-light: rgba(255, 255, 255, 0.03);
            --accent: #eab308;
            --accent-dim: rgba(234, 179, 8, 0.1);
            --success: #2dd4bf;
            --danger: #fb7185;
            --ambient-1: rgba(234, 179, 8, 0.04);
            --ambient-2: rgba(139, 92, 246, 0.04);
            --search-inset-dark: rgba(0, 0, 0, 0.9);
            --search-inset-light: rgba(255, 255, 255, 0.02);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--ff-body);
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient lighting overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 25% 15%, var(--ambient-1) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 85%, var(--ambient-2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .dashboard-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border-radius: var(--r-xl);
            box-shadow:
                14px 14px 28px var(--shadow-dark),
                -14px -14px 28px var(--shadow-light),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: cardRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        header {
            padding: 40px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .welcome-text h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.8px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .uid-badge {
            font-family: var(--ff-mono);
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .main-content {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: none;
            border-radius: var(--r-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow:
                inset 5px 5px 10px var(--search-inset-dark),
                inset -5px -5px 10px var(--search-inset-light);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }

        .activity-log {
            grid-column: span 2;
            background: var(--surface);
            border: none;
            border-radius: var(--r-lg);
            padding: 24px;
            box-shadow:
                inset 5px 5px 10px var(--search-inset-dark),
                inset -5px -5px 10px var(--search-inset-light);
        }

        .activity-log h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-family: var(--ff-mono);
            text-transform: uppercase;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 6px;
            border-radius: 12px;
            font-size: 14px;
            transition: background 0.15s ease;
            animation: logSlide 0.35s ease-out both;
        }

        .log-item:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        [data-theme="dark"] .log-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        @keyframes logSlide {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .log-item:last-child { margin-bottom: 0; }

        .log-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .log-time {
            font-family: var(--ff-mono);
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }

        .log-opponent {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .log-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 50px;
            font-family: var(--ff-body);
        }

        .log-badge.badge-win {
            color: var(--success);
            background: rgba(16, 185, 129, 0.12);
        }

        .log-badge.badge-loss {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .log-badge.badge-draw {
            color: var(--accent);
            background: var(--accent-dim);
        }

        .log-type {
            font-family: var(--ff-mono);
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .match-summary-strip {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .match-summary-strip {
            border-bottom-color: rgba(255, 255, 255, 0.04);
        }

        .summary-chip {
            font-family: var(--ff-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .summary-chip span {
            font-weight: 700;
        }

        .summary-chip.s-win span { color: var(--success); }
        .summary-chip.s-loss span { color: var(--danger); }
        .summary-chip.s-draw span { color: var(--accent); }

        .footer-actions {
            padding: 30px 40px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'DM Sans', sans-serif;
            border: none;
            will-change: transform;
        }

        .primary-btn {
            background: var(--surface);
            color: var(--text-primary);
            box-shadow:
                7px 7px 14px var(--shadow-dark),
                -7px -7px 14px var(--shadow-light),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .primary-btn:hover {
            box-shadow:
                inset 5px 5px 10px rgba(0, 0, 0, 0.10),
                inset -5px -5px 10px rgba(255, 255, 255, 0.28);
            transform: scale(0.98);
        }
        
        .primary-btn:active {
            transform: scale(0.94);
        }

        .logout-btn {
            background: var(--surface);
            color: var(--danger);
            box-shadow:
                4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
        }

        .logout-btn:hover {
            box-shadow:
                inset 3px 3px 6px rgba(0, 0, 0, 0.10),
                inset -3px -3px 6px rgba(255, 255, 255, 0.28);
            transform: scale(0.98);
        }

        .logout-btn:active {
            transform: scale(0.94);
        }

        /* ── Dark Mode Toggle ── */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            transition: transform .2s ease, box-shadow .2s ease;
            color: var(--text-muted);
            padding: 0;
        }

        .theme-toggle:hover {
            box-shadow:
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light);
            transform: scale(0.96);
        }

        .theme-toggle:active {
            transform: scale(0.91);
        }

        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* ── Decorative Sparkle ── */
        .sparkle {
            position: fixed;
            bottom: 28px;
            right: 32px;
            width: 22px;
            height: 22px;
            opacity: 0.25;
            animation: sparkle-twinkle 4s ease-in-out infinite;
            z-index: 1;
        }

        .sparkle svg { fill: var(--sparkle-fill); }

        @keyframes sparkle-twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.35; transform: scale(1.1) rotate(15deg); }
        }

        @media (max-width: 600px) {
            .dashboard-container { max-width: 100%; border-radius: 20px; }
            .main-content { grid-template-columns: 1fr; }
            .activity-log { grid-column: span 1; }
            .footer-actions { flex-direction: column; gap: 15px; }
            .footer-actions button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Dark mode toggle -->
    <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
    </button>

    <div class="dashboard-container">
        <header>
            <div class="welcome-text">
                <h2 id="greeting">Initializing...</h2>
                <div class="uid-badge" id="subtext">Awaiting Session</div>
            </div>
            <div class="status-indicator">
                <span id="sys-status" style="color: var(--success); font-weight: 700; font-size: 12px; font-family: var(--ff-mono);">● SYSTEM_ONLINE</span>
            </div>
        </header>

        <main class="main-content">
            <div class="stat-card">
                <span class="stat-label">Current ELO</span>
                <span class="stat-value" id="elo-val">...</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Matches Played</span>
                <span class="stat-value" id="matches-val">...</span>
            </div>

            <div class="activity-log">
                <h3>System Logs // Recent Activity</h3>
                <div id="match-log">
                    <div class="log-item">
                        <span style="color: var(--text-3)">Loading...</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer-actions">
            <button class="logout-btn" onclick="logout()">Terminate Session</button>
            <button class="primary-btn" onclick="enterLobby()">Enter Game Lobby</button>
        </footer>
    </div>



    <script src="/static/js/navbar.js"></script>
    <script src="/static/js/home.js"></script>

    <!-- Dark mode toggle script -->
    <script>
        (function () {
            const root = document.documentElement;
            const btn = document.getElementById("theme-toggle");
            const saved = localStorage.getItem("lb-theme");
            if (saved === "dark") root.setAttribute("data-theme", "dark");
            btn.addEventListener("click", () => {
                const isDark = root.getAttribute("data-theme") === "dark";
                if (isDark) {
                    root.removeAttribute("data-theme");
                    localStorage.setItem("lb-theme", "light");
                } else {
                    root.setAttribute("data-theme", "dark");
                    localStorage.setItem("lb-theme", "dark");
                }
            });
        })();
    </script>
</body>
</html>
