<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Leaderboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .lb-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: 2rem;
    }
    .lb-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lb-header h1 .trophy { font-size: 28px; }
    .lb-subtitle { font-size: 13px; color: #7c7c99; margin-top: 4px; }
    .lb-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #34d399;
      background: rgba(52,211,153,.1);
      border: 1px solid rgba(52,211,153,.2);
      border-radius: 20px;
      padding: 4px 10px;
    }
    .live-badge.error { color: #f87171; background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.2); }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
    .countdown { font-size: 11px; color: #7c7c99; }

    /* ── Podium ── */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .podium-card {
      border-radius: 12px;
      padding: 1.1rem .75rem;
      text-align: center;
      border: 1px solid #2e2e40;
      background: #161620;
    }
    .podium-card.top-1 {
      background: #1e1a07;
      border-color: #6b500f;
    }
    .podium-medal { font-size: 24px; display: block; margin-bottom: 6px; }
    .podium-name {
      font-size: 13px;
      font-weight: 500;
      color: #e8e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .podium-elo { font-size: 20px; font-weight: 700; margin-top: 5px; }
    .top-1 .podium-elo { color: #f4c542; }
    .top-2 .podium-elo { color: #b0bec5; }
    .top-3 .podium-elo { color: #c97c3e; }
    .podium-label { font-size: 10px; color: #7c7c99; margin-top: 3px; text-transform: uppercase; letter-spacing: .06em; }

    /* ── Table ── */
    .table-wrap {
      background: #161620;
      border: 1px solid #2e2e40;
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: 11px;
      font-weight: 500;
      color: #7c7c99;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #2e2e40;
    }
    thead th:last-child { text-align: right; }
    tbody tr + tr { border-top: 1px solid #1e1e2a; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: rgba(255,255,255,.03); }
    td { padding: 14px 16px; font-size: 14px; color: #e8e8f0; vertical-align: middle; }
    td.rank { width: 52px; font-size: 12px; font-weight: 500; color: #7c7c99; }
    td.name { font-weight: 500; }
    td.elo { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: #a5b4fc; }
    td.state { text-align: center; color: #7c7c99; padding: 36px; font-size: 14px; }
    td.state.err { color: #f87171; }

    /* ── Footer ── */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #7c7c99;
      text-decoration: none;
      border: 1px solid #2e2e40;
      border-radius: 8px;
      padding: 8px 14px;
      transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: #e8e8f0; border-color: #4a4a6a; }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #7c7c99;
      background: none;
      border: 1px solid #2e2e40;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: inherit;
      transition: color .15s, border-color .15s;
    }
    .refresh-btn:hover { color: #e8e8f0; border-color: #4a4a6a; }
    .refresh-btn svg { transition: transform .45s ease; }
    .refresh-btn.spinning svg { transform: rotate(360deg); }

    @media (max-width: 420px) {
      .podium-elo { font-size: 16px; }
      .podium-name { font-size: 11px; }
      .podium-medal { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="lb-header">
      <div>
        <h1><span class="trophy">🏆</span> Global Leaderboard</h1>
        <p class="lb-subtitle">Rankings updated in real time</p>
      </div>
      <div class="lb-meta">
        <span class="live-badge" id="live-badge">
          <span class="live-dot"></span> Live
        </span>
        <span class="countdown" id="countdown"></span>
      </div>
    </div>

    <div class="podium" id="podium" style="display:none">
      <div class="podium-card top-2">
        <span class="podium-medal">🥈</span>
        <div class="podium-name" id="pod-2-name">—</div>
        <div class="podium-elo" id="pod-2-elo">—</div>
        <div class="podium-label">2nd place</div>
      </div>
      <div class="podium-card top-1">
        <span class="podium-medal">🥇</span>
        <div class="podium-name" id="pod-1-name">—</div>
        <div class="podium-elo" id="pod-1-elo">—</div>
        <div class="podium-label">1st place</div>
      </div>
      <div class="podium-card top-3">
        <span class="podium-medal">🥉</span>
        <div class="podium-name" id="pod-3-name">—</div>
        <div class="podium-elo" id="pod-3-elo">—</div>
        <div class="podium-label">3rd place</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>ELO rating</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="3" class="state">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer-row">
      <a href="/lobby" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 12L6 8l4-4"/>
        </svg>
        Back to lobby
      </a>
      <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8A5.5 5.5 0 1 1 10 3.07"/>
          <polyline points="10 1 13.5 3.07 10 5.5"/>
        </svg>
        Refresh
      </button>
    </div>

  </div>

  <script src="/static/js/leaderboard.js"></script>
</body>
</html>
