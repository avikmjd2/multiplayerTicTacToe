<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #0a0a0a;
            --surface:      #141414;
            --surface-2:    #1e1e1e;
            --surface-3:    #2a2a2a;
            --border:       rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --accent:       #eab308;
            --accent-dim:   rgba(234, 179, 8, 0.1);
            --success:      #22c55e;
            --success-dim:  rgba(34, 197, 94, 0.1);
            --danger:       #ef4444;
            --danger-dim:   rgba(239, 68, 68, 0.1);
            --text:         #f8fafc;
            --text-2:       #94a3b8;
            --text-3:       #64748b;
            --ff-body:      'DM Sans', sans-serif;
            --ff-mono:      'JetBrains Mono', monospace;
            --r-sm:         8px;
            --r-md:         12px;
            --r-lg:         16px;
            --r-xl:         24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--ff-body);
            background-color: var(--bg);
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
        }

        .lobby-card {
            width: 100%;
            max-width: 1000px;
            min-height: 680px;
            display: flex;
            flex-direction: column;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lobby-header {
            padding: 30px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-title-area h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-3);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
        }

        .pulse-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .leaderboard-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-dim);
            color: var(--accent);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: var(--r-md);
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(234, 179, 8, 0.2);
            transition: all 0.2s ease;
        }

        .leaderboard-btn:hover {
            background: rgba(234, 179, 8, 0.15);
            border-color: rgba(234, 179, 8, 0.4);
            transform: translateY(-2px);
        }

        .player-grid {
            flex: 1;
            padding: 30px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            overflow-y: auto;
            align-content: start;
        }

        .player-grid::-webkit-scrollbar { width: 6px; }
        .player-grid::-webkit-scrollbar-track { background: transparent; }
        .player-grid::-webkit-scrollbar-thumb {
            background: var(--surface-3);
            border-radius: 10px;
        }

        .player-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 24px 16px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .player-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            background: var(--surface-3);
        }

        .host-card {
            border-color: rgba(234, 179, 8, 0.3);
            background: linear-gradient(180deg, rgba(234, 179, 8, 0.05), var(--surface-2));
        }

        .avatar {
            width: 56px; height: 56px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            transition: border-color 0.2s;
        }

        .player-card:hover .avatar {
            border-color: var(--accent);
            color: var(--accent);
        }

        .player-name {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-id {
            display: block;
            font-family: var(--ff-mono);
            font-size: 11px;
            color: var(--text-3);
        }

        .ready-status {
            margin-top: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-3);
            background: var(--surface);
            padding: 4px 0;
            border-radius: 4px;
        }

        .ready-status.is-ready {
            color: var(--success);
            background: var(--success-dim);
        }

        .ready-status.is-busy {
            color: var(--danger);
            background: var(--danger-dim);
        }

        .play-btn-mini {
            margin-top: 16px;
            padding: 10px 0;
            width: 100%;
            border-radius: var(--r-sm);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .play-btn-mini:hover:not(:disabled) {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .play-btn-mini:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .lobby-footer {
            padding: 24px 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom-left-radius: var(--r-xl);
            border-bottom-right-radius: var(--r-xl);
        }

        .chat-preview {
            font-family: var(--ff-mono);
            font-size: 13px;
            color: var(--text-2);
            flex: 1;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            margin-right: 24px;
            transition: opacity 0.2s ease, border-color 0.2s ease;
        }

        .ready-btn {
            padding: 14px 32px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: var(--text);
            color: var(--bg);
        }

        .ready-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.1);
        }

        .ready-btn.nowready {
            background: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
        }

        .ready-btn.nowready:hover {
            background: var(--danger-dim);
        }

        .challenge-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .challenge-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .challenge-header {
            padding: 24px;
            background: var(--surface-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .challenge-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .pulse-dot-red {
            width: 10px; height: 10px;
            background: var(--danger);
            border-radius: 50%;
            animation: pulseRed 1.5s infinite;
        }

        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        .challenge-content {
            padding: 32px 24px;
            text-align: center;
        }

        .challenger-profile {
            margin-bottom: 20px;
        }

        .challenger-avatar {
            width: 72px; height: 72px;
            font-size: 28px;
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .challenge-text {
            color: var(--text-2);
            font-size: 15px;
            line-height: 1.5;
        }

        .challenge-actions {
            padding: 20px 24px 24px;
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--r-md);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .decline-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .decline-btn:hover {
            background: var(--surface-3);
            border-color: var(--text-3);
        }

        .accept-btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
        }

        .accept-btn:hover {
            background: #facc15;
            transform: translateY(-2px);
        }

    </style>
</head>
<body>

    <div class="lobby-card">
        <header class="lobby-header">
            <div class="header-title-area">
                <h2>Tic Tac Toe</h2>
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span id="occupancy-text">0 Players Waiting</span>
                </div>
            </div>
            <a href="/leaderboard" class="leaderboard-btn">🏆 Leaderboard</a>
        </header>

        <main class="player-grid" id="player-container"></main>

        <footer class="lobby-footer">
            <div class="chat-preview" id="lobby-msg">System: Awaiting combatant readiness...</div>
            <button class="ready-btn" id="ready-toggle">Initialize Ready</button>
        </footer>
    </div>

    <div class="challenge-overlay" id="challenge-prompt" data-uid="" style="display: none;">
        <div class="challenge-card">
            <div class="challenge-header">
                <h3>Incoming Challenge</h3>
                <div class="pulse-dot-red"></div>
            </div>
            <div class="challenge-content">
                <div class="challenger-profile">
                    <div class="avatar challenger-avatar">V</div>
                    <span class="player-name">VoidWalker_99</span>
                    <span class="player-id">ELO: 2450</span>
                </div>
                <p class="challenge-text">Has invited you to a match. Do you accept?</p>
            </div>
            <div class="challenge-actions">
                <button class="action-btn decline-btn">Decline</button>
                <button class="action-btn accept-btn">Accept</button>
            </div>
        </div>
    </div>

    <script src="/static/js/lobby.js"></script>
</body>
</html>
