<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena :: System Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #0a0a0a;
            --surface:      #141414;
            --surface-2:    #1e1e1e;
            --surface-3:    #2a2a2a;
            --border:       rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --accent:       #eab308;
            --accent-dim:   rgba(234, 179, 8, 0.1);
            --text:         #f8fafc;
            --text-2:       #94a3b8;
            --text-3:       #64748b;
            --ff-body:      'DM Sans', sans-serif;
            --ff-mono:      'JetBrains Mono', monospace;
            --r-md:         12px;
            --r-lg:         16px;
            --r-xl:         24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--ff-body);
            background-color: var(--bg);
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .register-card {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: cardRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-section h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-3);
            font-family: var(--ff-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        /* Camera Viewport */
        .camera-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: var(--r-lg);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.9;
        }

        .hud-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .target-bracket {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40%; height: 50%;
            border: 1px dashed rgba(234, 179, 8, 0.2);
            border-radius: var(--r-md);
        }

        /* Input Styling */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            color: var(--text);
            font-family: var(--ff-body);
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            background: var(--surface-2);
        }

        input::placeholder {
            color: var(--text-3);
            font-family: var(--ff-mono);
            font-size: 12px;
        }

        /* Button Styling */
        #registerBtn {
            padding: 16px;
            border-radius: var(--r-md);
            background: var(--text);
            color: var(--bg);
            border: none;
            font-weight: 700;
            font-family: var(--ff-body);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        #registerBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.1);
            background: #ffffff;
        }

        #registerBtn:active {
            transform: translateY(0);
        }

        /* Status Bar matching Lobby Terminal */
        #statusMessage {
            font-family: var(--ff-mono);
            font-size: 12px;
            color: var(--text-2);
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            text-align: left;
            min-height: 42px;
            display: flex;
            align-items: center;
            
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            }

            #loading-overlay.active {
            opacity: 1;
            visibility: visible;
            }

            /* Spinner */
            .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #ddd;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            }

            /* Bottom text */
            #loading-text {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 16px;
            opacity: 0.9;
            }

            @keyframes spin {
            to {
                transform: rotate(360deg);
            }
            }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="header-section">
            <h2>Create Identity</h2>
            <p class="subtitle">Secure Biometric Registration</p>
        </div>

        <div class="camera-box">
            <video id="videoFeed" autoplay playsinline></video>
            <div class="hud-overlay">
                <div class="target-bracket"></div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="> SET_USERNAME" autocomplete="off">
            <input type="password" id="passwordInput" placeholder="> SET_PASSWORD">
        </div>

        <button id="registerBtn">Execute Registration</button>

        <div id="statusMessage">> SYSTEM_READY...</div>

        <canvas id="captureCanvas" width="640" height="480" style="display: none;"></canvas>
    </div>
    <div id="loading-overlay">
        <div class="loader"></div>
        <p id="loading-text">Logging in...</p>
    </div>
    <script src="/static/js/register.js"></script>
</body>
</html>
